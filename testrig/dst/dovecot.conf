# Dau DICH cua testrig: gia lam server cua chinh minh, namespace phang.
#
# Khac dau nguon o hai cho, co y:
#   - khong co tien to namespace, dau phan cach la "/" -> tool phai DOI dau
#     phan cach va BO tien to "INBOX." cua nguon khi dat ten ben nay.
#   - LAYOUT=fs thay vi Maildir++.
#
# KHONG dung file nay lam mau cho server that: ssl = no va mat khau de tran.

protocols = imap
listen = *
log_path = /dev/stderr
info_log_path = /dev/stderr

ssl = no
disable_plaintext_auth = no

auth_mechanisms = plain login
auth_master_user_separator = *
auth_verbose = yes

mail_location = maildir:/var/vmail/%d/%n/Maildir:LAYOUT=fs
mail_uid = vmail
mail_gid = vmail
mail_home = /var/vmail/%d/%n

namespace inbox {
  inbox = yes
  separator = /
  prefix =

  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
}

passdb {
  driver = passwd-file
  args = /etc/dovecot/master-users
  master = yes
}

passdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
}

userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
  default_fields = uid=vmail gid=vmail home=/var/vmail/%d/%n
}

service imap-login {
  inet_listener imap {
    port = 143
  }
}

mail_max_userip_connections = 10
