# Dau DICH cua testrig: gia lam server cua chinh minh, namespace phang.
#
# Khac dau nguon o hai cho, co y:
#   - khong co tien to namespace, dau phan cach la "/" -> tool phai DOI dau
#     phan cach va BO tien to "INBOX." cua nguon khi dat ten ben nay.
#   - LAYOUT=fs thay vi Maildir++.
#
# KHONG dung file nay lam mau cho server that: mat khau de tran, chung chi do
# mot CA vut di ky, va cong 143 khong ma hoa van mo.

protocols = imap
listen = *
log_path = /dev/stderr
info_log_path = /dev/stderr

# Mo CA HAI duong cung luc, co y:
#   143 khong ma hoa -- duong tool khuyen dung cho server noi bo trong mang kin
#   993 co TLS       -- duong moi ca migrate that di qua
# Chon duong nao la viec cua config.testrig.ini, khong phai sua o day.
#
# Chung chi do make-certs.sh sinh ra va PHAI chay truoc khi build. Dung cert
# tu ky khong duoc: tool xac thuc chung chi that su, nen phai co mot CA roi
# cho may chay tool tin CA do.
ssl = yes
ssl_cert = </etc/dovecot/tls/server.crt
ssl_key = </etc/dovecot/tls/server.key

# De 'no' cho ca hai cong deu dung duoc. Doi thanh 'yes' de thu mot server chi
# cho dang nhap qua ket noi ma hoa -- luc do duong 143 phai hong, va hong voi
# dung cau goi y "dat ssl = true va port = 993".
disable_plaintext_auth = no

auth_mechanisms = plain login
auth_master_user_separator = *
auth_verbose = yes

mail_location = maildir:/var/vmail/%d/%n/Maildir:LAYOUT=fs
mail_uid = vmail
mail_gid = vmail
mail_home = /var/vmail/%d/%n

# Quota: bat plugin nhung KHONG dat han muc (storage=0 la khong gioi han).
#
# De san o day de bai "dich het quota" chi can sua mot dong trong dst/users --
# them userdb_quota_rule=*:storage=1M cho mot hop thu -- thay vi phai sua file
# config nay roi nho duong ve. Xem muc "Dau dich het cho" trong README.
#
# Han muc dich la ca hong hay gap nhat ngoai doi ma rig chua bao gio dung toi:
# hop thu moi ben dich thuong bi dat 1GB trong khi hop thu cu da 8GB, va no
# chi lo ra vao GIUA lan chay dau tien.
mail_plugins = $mail_plugins quota

protocol imap {
  mail_plugins = $mail_plugins imap_quota
}

plugin {
  quota = maildir:User quota
  quota_rule = *:storage=0
}

namespace inbox {
  inbox = yes
  separator = /
  prefix =

  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
}

passdb {
  driver = passwd-file
  args = /etc/dovecot/master-users
  master = yes
}

passdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
}

userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
  default_fields = uid=vmail gid=vmail home=/var/vmail/%d/%n
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

mail_max_userip_connections = 10
