# Dau NGUON cua testrig: gia lam mot hosting doi cu kieu Maildir++.
#
# Hai thu co y dat nhu the nay:
#   1. namespace co tien to "INBOX." va dau phan cach "." -- de test phan cat
#      tien to CUA TOOL trong luc dang dang nhap bang master.
#   2. auth_master_user_separator duoc bat, nen CA HAI master_style deu chay.
#      Muon chung minh 'authzid' khong phu thuoc separator thi comment dong do
#      di roi chay lai preflight.
#
# KHONG dung file nay lam mau cho server that: mat khau de tran, chung chi do
# mot CA vut di ky, va cong 143 khong ma hoa van mo.

protocols = imap
listen = *
log_path = /dev/stderr
info_log_path = /dev/stderr

# Mo CA HAI duong cung luc, co y:
#   143 khong ma hoa -- duong tool khuyen dung cho server noi bo trong mang kin
#   993 co TLS       -- duong moi ca migrate that di qua
# Chon duong nao la viec cua config.testrig.ini, khong phai sua o day.
#
# Chung chi do make-certs.sh sinh ra va PHAI chay truoc khi build. Dung cert
# tu ky khong duoc: tool xac thuc chung chi that su, nen phai co mot CA roi
# cho may chay tool tin CA do.
ssl = yes
ssl_cert = </etc/dovecot/tls/server.crt
ssl_key = </etc/dovecot/tls/server.key

# De 'no' cho ca hai cong deu dung duoc. Doi thanh 'yes' de thu mot server chi
# cho dang nhap qua ket noi ma hoa -- luc do duong 143 phai hong, va hong voi
# dung cau goi y "dat ssl = true va port = 993".
disable_plaintext_auth = no

auth_mechanisms = plain login
auth_master_user_separator = *
auth_verbose = yes

mail_location = maildir:/var/vmail/%d/%n/Maildir
mail_uid = vmail
mail_gid = vmail
# Dovecot tu tao maildir cho user lan dau dang nhap.
mail_home = /var/vmail/%d/%n

namespace inbox {
  inbox = yes
  separator = .
  prefix = INBOX.

  # Co SPECIAL-USE. Day la duong nhan dang chinh cua tool; muon test duong
  # du phong (doan theo TEN folder, kieu Courier va Dovecot doi cu) thi
  # comment bon khoi nay di roi chay lai discover.
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
}

# Tai khoan quan tri. 'master = yes' la dong lam nen ca tinh nang auth = master.
# Khong co no thi Dovecot coi day la mot passdb thuong va moi thu se that bai
# voi "Authentication failed" ma khong noi vi sao.
passdb {
  driver = passwd-file
  args = /etc/dovecot/master-users
  master = yes
}

passdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
}

userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
  default_fields = uid=vmail gid=vmail home=/var/vmail/%d/%n
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

# Mac dinh la 10. De nguyen de con do duoc buoc #7 trong README: mo 3 luong
# song song bang mot tai khoan master, xem Dovecot dem ket noi theo hop thu
# hay theo master user.
mail_max_userip_connections = 10
