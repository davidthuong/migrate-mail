; Config tro vao testrig. Ten file khong phai "config.ini" co y: .gitignore
; chan config.ini o moi cap, va file nay thi PHAI commit duoc.
;
;   python3 mm.py --config testrig/config.testrig.ini \
;                 --users  testrig/users.testrig.csv doctor

[source]
provider = dovecot
host = 127.0.0.1
port = 10993
ssl  = true

auth = master
master_user     = migrate
master_password = MatKhauMasterNguon
; Doi thanh 'separator' cho buoc #8 trong README.
master_style    = authzid

; Dau nguon co tien to "INBOX." -- de auto de xem tool tu do dung khong.
prefix = auto

[dest]
provider = dovecot
host = 127.0.0.1
port = 20993
ssl  = true

; Buoc dau dich van dang nhap bang mat khau tung hop thu, de con so sanh voi
; dau nguon dang chay master. Buoc #9 doi cho nay sang master.
auth = password
;auth = master
;master_user     = migrate
;master_password = MatKhauMasterDich

prefix = auto

[sync]
workers = 3
timeout = 60
; KHONG khai ten folder dac biet o day, co y: Dovecot dich goi folder rac la
; "Junk" trong khi mac dinh cua tool la "Spam", nen lan chay nao ma mail vao
; dung "Junk" la lan do chung minh tool da doc co SPECIAL-USE cua dau dich.
; Khai junk_folder = Junk o day la tu che mat cho hong.

[paths]
imapsync = imapsync
logdir   = logs
statedir = state
