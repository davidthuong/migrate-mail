; Copy file nay thanh config.ini roi sua.
;   cp config.example.ini config.ini
;
; Xem cac nguon duoc ho tro va viec phai chuan bi cho tung nguon:
;   ./mm.py providers
;   ./mm.py providers m365

[source]
; provider quyet dinh ba thu: host mac dinh, cach nhan ra folder dac biet
; (Sent/Drafts/Trash/Junk), va folder nao khong phai mail nen bo qua.
;   gmail     Gmail / Google Workspace
;   m365      Microsoft 365 / Exchange Online
;   exchange  Exchange Server tu dung
;   dovecot   cPanel / DirectAdmin / Plesk
;   courier   Courier IMAP (hosting doi cu)
;   zimbra    Zimbra
;   yahoo | zoho | icloud
;   imap      IMAP chung -- dung khi nguon khong nam trong danh sach tren
provider = gmail

; Bo trong thi lay host mac dinh cua provider. Server tu dung (dovecot,
; zimbra, exchange, courier, imap) khong co mac dinh nen bat buoc phai dien.
host = imap.gmail.com
port = 993
ssl  = true

; --- Xac thuc -------------------------------------------------------------
;   password  Mat khau (hoac app password) cua tung mailbox, doc tu users.csv.
;             MAC DINH.
;   oauth2    Chi cho Microsoft 365. Dang ky mot app tren Entra ID, cap cho no
;             quyen doc mailbox toan tenant, roi tool tu lay token -- KHONG can
;             mat khau cua tung user. Day gan nhu la cach duy nhat con dung
;             duoc voi M365 vi Microsoft da tat basic auth.
;   master    Dang nhap bang tai khoan quan tri (Dovecot master user, Zimbra
;             admin). CHUA HIEN THUC -- dat gia tri nay se bao loi ngay.
auth = password

; Chi dung khi auth = oauth2. Cach lay ba gia tri nay: ./mm.py providers m365
;oauth_tenant        = contoso.onmicrosoft.com
;oauth_client_id     = 00000000-0000-0000-0000-000000000000
;oauth_client_secret = ...
; Hoac de secret ra file rieng (nen dung, de con backup/gui config.ini duoc):
;oauth_client_secret_file = oauth-secret.txt

; Tien to namespace cua server nay.
;   auto   Doc bang lenh NAMESPACE. MAC DINH, dung cho gan het truong hop.
;   none   Coi nhu khong co tien to.
;   <text> Tien to viet cung, vd "INBOX." -- dung khi server tra ve NAMESPACE
;          sai (gap o vai ban Courier cu).
;
; Hosting kieu Maildir++ (Courier, mot so ban Dovecot) de moi folder duoi
; "INBOX." voi dau phan cach la '.'. Ben NGUON tool cat tien to nay di, ben
; DICH tool them no vao -- neu khong, folder se moc ra ngoai INBOX hoac chui
; vao mot cay "INBOX" long nhau.
;prefix = auto

[dest]
; Ben dich cung khai bao provider: no quyet dinh ten folder mac dinh
; (IceWarp goi folder rac la Spam, Exchange goi la Junk Email) va bo goi y
; xu ly loi khi ghi mail vao.
provider = icewarp
host = mail.congty.vn
port = 993
ssl  = true

; Giong [source]: auto | none | <tien to viet cung>. Ben dich tien to duoc
; THEM vao truoc moi ten folder (tru INBOX).
;prefix = auto

[sync]
; So mailbox chay cung luc. Nguon thuong bop bang thong theo tung account, nen
; tang con so nay chi nhanh hon khi co nhieu mailbox -- khong lam 1 mailbox
; nhanh len. Voi duoi 20 mailbox, 3-4 la hop ly.
workers = 3

; Giay. Tang len neu duong truyen toi server dich cham.
timeout = 300

; Dung mailbox do lai sau bao nhieu loi le.
errorsmax = 50

; Bo qua mail lon hon N byte (0 = khong gioi han).
; Dat khop voi gioi han kich thuoc mail cua server dich, neu khong imapsync se
; bao loi tung mail mot cho den khi cham errorsmax.
; 52428800 = 50 MB
maxsize = 0

; Bop bang thong tinh bang byte/giay (0 = khong bop).
; Huu ich khi chay ban ngay va khong muon nghen duong truyen van phong.
; 2097152 = 2 MB/s
maxbytespersecond = 0

; --- Xu ly dac thu cua Gmail ---------------------------------------------
; CHI co tac dung khi provider cua [source] la gmail. Cac nguon khac khong co
; folder ao nen ba dong nay bi bo qua.
;
; Gmail dung "label" chu khong phai folder. Mot mail gan 3 label se xuat hien
; o 3 noi, va xuat hien them mot lan nua trong "All Mail". Copy ca All Mail
; se lam dung luong ben dich phinh len gap nhieu lan.
; De true tru khi ban co ly do rat cu the.
exclude_all_mail = true
exclude_important = true
exclude_starred = true

; CHI bat khi exclude_all_mail = false. Khi do imapsync se chi chep moi mail
; mot lan duy nhat. Neu bat trong khi da exclude All Mail, mail nam trong
; nhieu label se bi mat bot ban sao.
skipcrossduplicates = false

; --- Ten folder dich -----------------------------------------------------
; Tool nhan dien folder Sent/Drafts/Trash/Junk cua nguon qua co SPECIAL-USE
; (khong phu thuoc ngon ngu account); server nao khong gan co thi doi chieu
; theo ten ("Sent Items", "Thu da gui", "INBOX.Sent"...).
;
; Bo trong thi lay ten mac dinh cua provider ben [dest]. Kiem tra ten that
; bang: ./mm.py discover --dest  roi doi neu can.
;sent_folder   = Sent
;drafts_folder = Drafts
;trash_folder  = Trash
;junk_folder   = Spam
; De trong = giu nguyen ten folder luu tru cua nguon.
;archive_folder =

; --- Ngay thang cua mail -------------------------------------------------
; Day la nguyen nhan cua trieu chung "mail nhay het ve ngay migrate".
;
;   internal  Dung INTERNALDATE cua nguon, tuc ngay mail di vao hop thu ben do.
;             Day la thu user dang nhin thay, nen chon cai nay thi mail ben
;             dich trong giong het ben nguon. MAC DINH.
;
;   header    Dung header Date: trong than mail, tuc ngay nguoi gui bam Gui.
;             Chi doi sang cai nay khi: (a) internal khong giu duoc ngay, hoac
;             (b) hop thu nguon truoc day da import tu noi khac nen INTERNALDATE
;             la ngay import chu khong phai ngay that.
;
; Chay ./mm.py verify sau khi sync de kiem chung ngay co sang dung khong.
date_source = internal

; Bo cac flag ma server dich khong nhan (vd flag rieng cua Gmail) thay vi de
; imapsync bao loi tren tung mail.
filterflags = true

; Giu cache dong bo giua cac lan chay -> vong delta luc cutover nhanh hon nhieu.
usecache = true

; Tham so imapsync them, viet nhu tren dong lenh. Vd:
;   extra_args = --debugimap --exclude ^Archive$
extra_args =

[paths]
; Duong dan toi imapsync. De nguyen "imapsync" neu no da nam trong PATH.
; auth = oauth2 can imapsync 2.251 tro len; ./mm.py doctor se bao neu ban
; dang cai qua cu.
imapsync = imapsync
logdir   = logs
statedir = state
